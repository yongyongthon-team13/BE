spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:h2:mem:yongyong;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.mvc.problemdetails.enabled=true

spring.config.import=optional:file:.env[.properties]
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.jackson.time-zone=Asia/Seoul
app.data-key=${APP_DATA_KEY:}
app.auth.jwt-secret=${APP_JWT_SECRET:}
app.sms.provider=${SMS_PROVIDER:none}
app.sms.ncloud.service-id=${NCLOUD_SMS_SERVICE_ID:}
app.sms.ncloud.access-key=${NCLOUD_ACCESS_KEY:}
app.sms.ncloud.secret-key=${NCLOUD_SECRET_KEY:}
app.sms.ncloud.sender=${NCLOUD_SMS_SENDER:}
