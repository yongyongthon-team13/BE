spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:h2:mem:yongyong;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.mvc.problemdetails.enabled=true

spring.config.import=optional:file:.env[.properties]
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.1-flash-lite,gemini-3.6-flash}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jackson.time-zone=Asia/Seoul
kma.service-key=${KMA_SERVICE_KEY:}
weather.simulated-warning=${WEATHER_SIMULATED_WARNING:}
app.data-key=${APP_DATA_KEY:}
app.auth.jwt-secret=${APP_JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,https://yongyongthon-team13.expo.app}
spring.flyway.locations=classpath:db/migration,classpath:db/migration-vendor/{vendor}
app.sms.provider=${SMS_PROVIDER:none}
app.sms.sendm.user-id=${SENDM_USER_ID:}
app.sms.sendm.api-key=${SENDM_API_KEY:}
app.sms.sendm.sender=${SENDM_SENDER:}
app.auth.demo-phones=${DEMO_PHONES:}
app.auth.demo-code=${DEMO_CODE:}
providers.tmap.app-key=${TMAP_APP_KEY:}
providers.tmap.transit-app-key=${TMAP_TRANSIT_APP_KEY:${TMAP_APP_KEY:}}
providers.gbis.service-key=${GBIS_SERVICE_KEY:}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.trips.delay-threshold-minutes=${TRIP_DELAY_THRESHOLD_MINUTES:10}
app.trips.delay-dwell-minutes=${TRIP_DELAY_DWELL_MINUTES:5}
app.trips.location-cleanup-ms=${TRIP_LOCATION_CLEANUP_MS:60000}
app.trips.no-response-grace-minutes=${TRIP_NO_RESPONSE_GRACE_MINUTES:5}
app.trips.no-response-check-ms=${TRIP_NO_RESPONSE_CHECK_MS:60000}
app.push.expo-access-token=${EXPO_ACCESS_TOKEN:}
app.push.dispatch-ms=${PUSH_DISPATCH_MS:5000}
springdoc.swagger-ui.url=/v3/api-docs/assigned-api
springdoc.swagger-ui.disable-swagger-default-url=true
app.companion.service-phone=${COMPANION_SERVICE_PHONE:0000-0000}
