services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gilbut}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.oci}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.oci}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.oci}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-gilbut}?connectionTimeZone=Asia%2FSeoul&forceConnectionTimeZoneToSession=true
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.oci}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.oci}
      APP_DATA_KEY: ${APP_DATA_KEY:?Set APP_DATA_KEY in .env.oci}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env.oci}
      SPRINGDOC_SWAGGER_UI_URL: ""
      TMAP_APP_KEY: ${TMAP_APP_KEY:-}
      TMAP_TRANSIT_APP_KEY: ${TMAP_TRANSIT_APP_KEY:-}
      GBIS_SERVICE_KEY: ${GBIS_SERVICE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      NCLOUD_SMS_SERVICE_ID: ${NCLOUD_SMS_SERVICE_ID:-}
      NCLOUD_ACCESS_KEY: ${NCLOUD_ACCESS_KEY:-}
      NCLOUD_SECRET_KEY: ${NCLOUD_SECRET_KEY:-}
      NCLOUD_SMS_SENDER: ${NCLOUD_SMS_SENDER:-}
    ports:
      - "8080:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
