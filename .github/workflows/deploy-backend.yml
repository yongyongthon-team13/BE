name: Deploy backend to OCI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Copy source and restart API
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/gilbut_actions
          chmod 600 ~/.ssh/gilbut_actions
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          tar -czf /tmp/gilbut-backend.tar.gz \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='.env*' \
            .

          ssh -i ~/.ssh/gilbut_actions \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_USER@$OCI_HOST" \
            "mkdir -p /home/opc/gilbut-backend"

          scp -i ~/.ssh/gilbut_actions \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            /tmp/gilbut-backend.tar.gz \
            "$OCI_USER@$OCI_HOST:/tmp/gilbut-backend.tar.gz"

          ssh -i ~/.ssh/gilbut_actions \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_USER@$OCI_HOST" \
            "tar -xzf /tmp/gilbut-backend.tar.gz -C /home/opc/gilbut-backend && \
             rm -f /tmp/gilbut-backend.tar.gz && \
             printf '%s\\n' '$GITHUB_SHA' > /home/opc/gilbut-backend/.deployed-commit && \
             cd /home/opc/gilbut-backend && \
             docker compose --env-file .env.oci -f compose.oci.yaml up -d --build api"
